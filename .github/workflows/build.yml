# Builds Riverwing in the cloud on every push to main:
#   - riverwing.apk       install on Android phones
#   - riverwing-web.zip   upload to itch.io for the browser version
# Each build is published as a GitHub Release, so the newest APK is always at
#   https://github.com/<owner>/<repo>/releases/latest
name: Build Riverwing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and its export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$TPL/"
          rm -f ./*.zip ./*.tpz

      - name: Tell Godot where Java and the Android SDK are
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
          cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          EOF
          done
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export the APK and the web build
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          GODOT="$HOME/godot/godot"
          mkdir -p build/web
          touch build/.gdignore
          # on failure, show the end of Godot's log as an error on the run page
          report() {
            msg=$(tail -n 40 "$1" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$2::$msg"
          }
          timeout 600 "$GODOT" --headless --import > import.log 2>&1 || true
          tail -n 20 import.log
          # self-test: play through every system for ~40 game seconds, headless
          timeout 300 "$GODOT" --headless --fixed-fps 60 --path . -- --autotest > test.log 2>&1 || true
          cat test.log
          if grep -qE "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid operands|Invalid assignment" test.log || ! grep -q "AUTOTEST OK" test.log; then
            grep -nE -A4 "SCRIPT ERROR|Parse Error|Invalid" test.log > errs.log || true
            [ -s errs.log ] || tail -n 40 test.log > errs.log
            report errs.log "Self-test failed"
            exit 1
          fi
          # summary on the run page: result line plus any engine errors or warnings
          { grep "AUTOTEST OK" test.log; grep -E "ERROR|WARNING" test.log | sort | uniq -c | sort -rn | head -n 15; } > summary.log || true
          msg=$(sed -e 's/%/%25/g' summary.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Self-test passed::$msg"
          if ! "$GODOT" --headless --export-debug "Android" build/riverwing.apk > apk.log 2>&1 || [ ! -f build/riverwing.apk ]; then
            cat apk.log
            report apk.log "Android export failed"
            exit 1
          fi
          cat apk.log
          if ! "$GODOT" --headless --export-release "Web" build/web/index.html > web.log 2>&1 || [ ! -f build/web/index.html ]; then
            cat web.log
            report web.log "Web export failed"
            exit 1
          fi
          cat web.log
          (cd build/web && zip -q -r ../riverwing-web.zip .)
          ls -la build build/web

      - name: Keep the files on this run
        uses: actions/upload-artifact@v4
        with:
          name: riverwing-build-${{ github.run_number }}
          path: |
            build/riverwing.apk
            build/riverwing-web.zip

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Riverwing build ${{ github.run_number }}
          body: |
            riverwing.apk: install on Android (allow "Install unknown apps" when asked).
            riverwing-web.zip: upload to itch.io for the browser version.
            Built from commit ${{ github.sha }}.
          files: |
            build/riverwing.apk
            build/riverwing-web.zip
